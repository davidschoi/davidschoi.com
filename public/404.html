<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>David S Choi</title>
    <script>
      // GitHub Pages serves this for any path it has no file for. Rewrite the
      // path into a query string and bounce to /, where the inline script in
      // index.html puts it back before React Router mounts.
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/?/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
